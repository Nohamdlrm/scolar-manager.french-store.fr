<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turabo Self</title>
<meta name="description" content="Turabo Self — l'application de cantine du campus : commander son repas, suivre son solde et voir le stock en direct.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="container">
      <a href="#accueil" class="brand" aria-label="Turabo Self">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="var(--ink-soft)"/>
          <g transform="translate(-1.6 -1.3) scale(.16)">
      <path d="M202 200 L252 244 L230 250 L190 214 Z" style="fill:var(--brick)"/>
      <path d="M132 168 C 146 136, 196 136, 214 170 C 222 190, 198 214, 168 212 C 144 210, 126 190, 132 168 Z" style="fill:var(--paper)"/>
      <circle cx="136" cy="164" r="22" style="fill:var(--paper)"/>
      <path d="M176 160 C 176 100, 214 70, 262 62 C 258 108, 226 150, 184 176 Z" style="fill:var(--gold)"/>
      <path d="M170 156 C 168 112, 190 92, 214 84 C 206 116, 192 140, 176 164 Z" style="fill:var(--gold-dark)"/>
      <path d="M116 158 L58 134 L118 176 Z" style="fill:var(--gold)"/>
      <path d="M122 172 C 130 186, 146 190, 156 184 C 146 178, 132 174, 122 172 Z" style="fill:var(--brick)"/>
      <circle cx="130" cy="160" r="4" style="fill:var(--ink)"/>
          </g>
        </svg>
        <span class="brand-text">
          <span class="school">Turabo Self</span>
          <span class="place" id="site-tagline"></span>
        </span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Navigation principale"></nav>

      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="btn btn-ghost btn-sm" id="btn-app" href="https://self.campus-rosaparks.fr/" target="_blank" rel="noopener"></a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="page-root">
    <!-- Les pages sont générées par app.js -->
  </main>

  <footer>
    <div class="container" id="footer-root">
      <!-- Généré par app.js -->
    </div>
  </footer>

  <!-- Visionneuse d'image (galerie) -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Fermer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
